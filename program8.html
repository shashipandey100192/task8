<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>heading</h1>
    <h1 id="time">time</h1>

    <script>
        function abc()
        {
        let a = new Date();
        console.log(a);
        console.log(typeof a);
        var m =a.getMinutes();
        var s = a.getSeconds();
        var h = a.getHours();
        var currenttime = `Time: ${h} : ${m} : ${s}`;
        var mydis = document.getElementById('time');
            mydis.innerHTML = currenttime;

        }

        setInterval("abc()",1000);
    </script>
    
</body>
</html>
